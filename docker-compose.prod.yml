# ============================================================
# Loto Production Docker Compose
# Shares nginx from ChatLingua (external network)
# Deploy with: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ========================================
  # MySQL Database (Loto riêng)
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: loto-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: loto_db
      MYSQL_USER: loto_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - loto-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

  # ========================================
  # Backend API (NestJS)
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: loto-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: loto_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://${DOMAIN:-loto.dongquoctien.online}
      UPLOAD_DIR: ./uploads
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - loto-internal
      - chatlingua_default
    expose:
      - "3000"

  # ========================================
  # Frontend (Angular + Nginx)
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: loto-frontend
    restart: always
    networks:
      - loto-internal
      - chatlingua_default
    expose:
      - "4000"

# ========================================
# Networks
# ========================================
networks:
  # Internal network for loto services (mysql <-> backend)
  loto-internal:
    driver: bridge
  # External network shared with ChatLingua nginx
  chatlingua_default:
    external: true
    name: chatlingua_chatlingua-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
