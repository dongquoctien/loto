services:
  mysql:
    image: mysql:8.0
    container_name: loto-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-loto_db}
      MYSQL_USER: ${DB_USERNAME:-loto_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-loto_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: loto-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-loto_user}
      DB_PASSWORD: ${DB_PASSWORD:-loto_password}
      DB_DATABASE: ${DB_DATABASE:-loto_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/apps/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: loto-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
